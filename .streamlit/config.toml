[browser]
gatherUsageStats = false

[client]
# 예외를 삼키면 원인 없는 빈 화면만 남는다. 스택트레이스를 노출한다.
showErrorDetails = true
toolbarMode = "minimal"

[server]
# 로컬 실행 기본값. Streamlit Cloud 는 이 값들을 무시하고 자체 설정을 쓴다.
headless = false
port = 8501
# 업로드 이미지 상한 (스크린샷은 보통 1MB 미만)
maxUploadSize = 20

[theme]
base = "dark"
primaryColor = "#64d2ff"
backgroundColor = "#0a0a0b"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
