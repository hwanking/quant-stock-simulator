[browser]
gatherUsageStats = false

[client]
# 예외를 삼키면 원인 없는 빈 화면만 남는다. 스택트레이스를 노출한다.
showErrorDetails = true
toolbarMode = "minimal"

[server]
# ⚠️ port·headless 는 여기에 두지 않는다.
#    Streamlit Cloud 도 이 파일을 읽기 때문에, 포트를 고정하면 클라우드가 할당한
#    포트와 충돌해 앱이 뜨지 않는다. 로컬 포트는 .claude/launch.json 이 넘긴다.
# 업로드 이미지 상한 (스크린샷은 보통 1MB 미만)
maxUploadSize = 20

[theme]
# ⚠️ secondaryBackgroundColor 는 **카드 표면**이다 (익스팬더·데이터프레임
#    머리·메트릭 등 Streamlit 자체 위젯이 이 색으로 칠해진다).
#    라운드 115 까지 여기가 #161D2A 였는데 ui_kit 팔레트의 카드 토큰은
#    #16181F 라, 화면에 카드가 두 계열로 갈려 있었다(45개 vs 30개).
#    §5 는 카드 한 종류를 요구하고 "색은 ui_kit 팔레트가 유일 출처" 라고도
#    한다 — 그래서 팔레트 값(ui_kit.DARK['card'])으로 맞춘다.
#    이 파일은 toml 이라 파이썬 상수를 못 읽는다. 대신 회귀가 두 값이
#    같은지 **값으로** 대조한다 (§81).
#    primaryColor 도 같은 이유로 팔레트 브랜드에 맞춘다 (라운드 116).
#    여기가 #4C8DFF 였는데 팔레트 brand 는 #488AF7 이라 주요 버튼만 다른
#    파랑이었다. ui_kit 주석이 적어 뒀듯 brand 는 "다크의 모든 표면에서
#    4.5 를 넘기려고 명도를 조정한 값" 이다 — 그 보정을 버리면 안 된다.
#    라운드 399 — 제미나이 톤으로 팔레트를 바꿨다(ui_kit.DARK). 네 값 모두 팔레트와 같은 값이어야 한다
#    (bg · brand · card · tx1) — 회귀가 값으로 대조한다(§81). 안 맞추면 첫 그림에 옛 색이 번쩍인다.
#    라운드 471 — 가늠 톤(가늠 코인과 같은 계열)으로 팔레트를 바꾸고 이 파일을 안 옮겨, 맨 위 화면 전환의 고른 칸이 옛
#    제미나이 파랑이었다(브라우저 실측). 지금 팔레트 값으로.
base = "dark"
primaryColor = "#77DCC3"
backgroundColor = "#101518"
secondaryBackgroundColor = "#181F24"
textColor = "#F1F5F4"
