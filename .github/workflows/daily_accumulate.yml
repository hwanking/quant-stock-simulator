name: 일일 케이스 축적 (전방 데이터)

# ■ 왜 있는가
#   전방 재평가(R55·R57·R66)는 2026-08-09 이후 새로 쌓이는 데이터로만
#   판정한다. 그 데이터가 "PC 를 켜 뒀는가"에 달려 있으면 안 된다.
#   장 마감 후 클라우드에서 스스로 쌓는다.
#
# ■ 무엇을 하지 않는가 (전방 재평가일까지 동결 준수 — 2026-11-16)
#   날짜 근거: docs/FORWARD_EVAL_DATE_R78.md · 단일 출처: forward_eval.py
#   · 점수·게이트·문턱을 바꾸지 않는다. 케이스를 **기록만** 한다
#   · 모델 선택·채택 판정을 하지 않는다 — 사람이 사전등록 후 돌린다
#   · 원장은 append-only. 기존 행을 고치지 않는다

on:
  schedule:
    # 한국 장 마감(15:30 KST) 뒤 — UTC 08:00 = KST 17:00, 평일만
    - cron: '0 8 * * 1-5'
  workflow_dispatch:          # 손으로도 돌릴 수 있게

concurrency:
  group: daily-accumulate     # 겹쳐 돌면 원장이 섞인다
  cancel-in-progress: false

# ⚠️ 라운드 71 — 이게 없어서 첫 실행이 실패했다.
#   기본 GITHUB_TOKEN 은 `contents: read` 다. 75분간 축적은 멀쩡히 돌았고
#   마지막 업로드에서 `HTTP 403: Resource not accessible by integration`
#   으로 죽었다. 즉 **쌓기는 쌓았는데 저장이 안 됐다** — PC 가 꺼져도
#   데이터가 남게 하려던 목적이 정확히 그 한 줄 때문에 비어 있었다.
#   릴리스 생성·업로드에는 쓰기가 필요하다. 그 이상은 주지 않는다.
permissions:
  contents: write

jobs:
  accumulate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # ⚠️ 라운드 86 — 러너 시계는 UTC 인데 엔진은 **now() 가 KST 라고
    #   가정**한다 (bitemporal_engine.resolve_analysis_date §3 명세:
    #   "장 종료 후 → 오늘 종가, 장중·장 시작 전 → 직전 거래일").
    #   스케줄이 08:00 UTC 인데 엔진은 그것을 '08:00 KST = 장 시작 전'으로
    #   읽어 **직전 거래일**을 돌려줬다.
    #
    #   결과: 전방 기록기가 매일 어제 날짜를 찍고, 중복 방지에 걸려
    #   **아무것도 안 쌓였다.** predictions.jsonl 이 171 에서 멈춰 있었다.
    #   축소가 아니라 정체라 가드도 못 잡았다 — 라운드 81 과 같은 모양이다.
    #
    #   엔진을 고치지 않고(계산 파일) 시계를 진실로 만든다. 이러면 명세의
    #   가정이 실제로 성립한다.
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 지난 원장 내려받기 (없으면 새로 시작)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .portfolio
          # ⚠️ 라운드 81 — 여기서 **매일 어제 것을 복원**하고 있었다.
          #   종전: sort_by(.createdAt) | last
          #   그런데 릴리스의 createdAt 은 **처음 만든 시각**이고, 자산을
          #   `--clobber` 로 덮어써도 안 바뀐다. data-20260811 과
          #   data-20260812 의 createdAt 이 초 단위까지 같았고
          #   (2026-08-10T05:42:42Z), jq 의 sort_by 는 동률에서 입력 순서를
          #   지키므로 `last` 가 **20260811** 을 집었다.
          #   결과: 매 실행이 8/11 스냅샷에서 시작해 400건 더하고 8/12 로
          #   올렸다 — 이틀 연속 원장이 182,359 에서 멈춰 있었다.
          #   **축적이 하루도 안 쌓이고 있었다.**
          #
          #   고침: 자산이 **실제로 쓰인 시각**(assets[].updated_at)으로
          #   고른다. 자산이 없는 릴리스(업로드 전 실패)는 제외한다.
          #   태그 이름 정렬로도 되지만, 어떤 이유로 옛 태그에 새 자산을
          #   올리는 일이 생기면 또 틀린다. '언제 쓰였나'가 정답이다.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name|startswith("data-"))
                  | select([.assets[]|select(.name|startswith("research_data_"))]|length > 0)
                  | "\([.assets[]|select(.name|startswith("research_data_"))|.updated_at]|max)\t\(.tag_name)"' \
            > /tmp/snaps.tsv || true
          echo "── 후보 스냅샷 (자산 갱신 시각 순) ──"
          sort /tmp/snaps.tsv || true
          TAG=$(sort /tmp/snaps.tsv | tail -1 | cut -f2)
          if [ -n "$TAG" ]; then
            echo "복원: $TAG (가장 최근에 쓰인 자산)"
            gh release download "$TAG" -D . --clobber
            for z in research_data_*.zip; do
              [ -e "$z" ] && unzip -o -q "$z" && rm -f "$z"
            done
          else
            echo "이전 스냅샷 없음 — 빈 원장으로 시작"
          fi
          ls -la .portfolio/ | head -5

      # 복원 직후 줄 수를 박제한다. 업로드 직전에 이 값과 대조해서
      # **줄어들었으면 업로드를 막는다** (라운드 71c).
      - name: 복원 기준선 기록
        run: |
          python scripts/snapshot_guard.py --record

      - name: 케이스 축적 (기록만)
        run: |
          python scripts/calibration_lab.py --limit 400 || true

      # ⚠️ 라운드 78 — 전방 구간은 **날짜를 전부** 써야 한다.
      #   기본 기준일 규칙은 25봉 간격이라 45거래일짜리 전방 구간에서
      #   날짜가 2개뿐이다. R55 는 국면 라우팅이고 국면은 시장 수준
      #   변수라 **날짜가 표본**이다 — 2개로는 평가가 성립하지 않는다.
      #   (전수 스윕 하루는 케이스 3,000건이어도 국면 칸은 1칸이다.)
      #
      #   아직 20영업일이 안 지난 날짜는 usable 상한에서 자동으로 빠지므로
      #   첫 수확일은 2026-09-07 이다. 그 전에는 "0개"라고 밝히고 끝난다 —
      #   0건을 '다 했다'로 쓰지 않는다.
      - name: 전방 구간 집중 축적 (재평가용 · 2026-09-07 부터 수확)
        run: |
          python scripts/calibration_lab.py --forward-only \
            --universe --limit 400 || true

      - name: 경로·기준선 보강 (신규 신호분)
        run: |
          python scripts/path_recorder.py || true
          python scripts/entry_anchor_recorder.py || true

      # ⚠️ 라운드 77 — 전방 재평가(R55·R57·R66)가 쓸 데이터를 **아무도
      #   자동으로 쌓고 있지 않았다.** predictions.jsonl 을 쓰는 것은
      #   web_app.py 와 premarket.py 뿐인데 둘 다 여기서 안 돈다.
      #   실측: 전방 27건이 전부 8/10·8/11·8/12 — 사람이 앱을 띄운 날만
      #   기록됐다. 라운드 68 에서 없애려던 'PC 를 켜 뒀는가' 의존이
      #   전방 쪽에 그대로 남아 있었다.
      #
      #   calibration_lab 은 전방을 만들 수 없다 — usable 이
      #   dates[260:len-21] 이라 오늘 날짜 케이스는 원리적으로 못 만든다
      #   (20봉이 지나야 채점되므로). 전방은 여기서 먼저 쌓인다.
      - name: 전방 판정 기록 (오늘 판정을 박제)
        run: |
          python scripts/forward_recorder.py --top 60 || true

      - name: 뉴스 사건 기록·사후 경로 채움 (관측 전용)
        run: |
          python scripts/news_event_recorder.py --record || true
          python scripts/news_event_recorder.py --resolve || true

      - name: 개인 자료가 섞이지 않았는지 확인 (§9)
        run: |
          if ls .portfolio/positions* .portfolio/holdings* 2>/dev/null; then
            echo "개인 자료 발견 — 백업을 중단한다"; exit 1
          fi
          echo "개인 자료 없음 확인"

      # 복원 때보다 줄었으면 여기서 멈춘다 — 좋은 스냅샷을 나쁜 것으로
      # 덮는 사고가 실제로 났다 (원장 60,462건 → 400건, 라운드 71c).
      - name: 스냅샷이 줄지 않았는지 확인
        run: |
          python scripts/snapshot_guard.py --verify

      - name: 새 스냅샷 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/backup_research_data.py
          STAMP=$(date -u +%Y%m%d)
          Z=$(ls _archive/research_data_*.zip | tail -1)
          gh release create "data-$STAMP" "$Z" \
            --title "연구 데이터 $STAMP (자동)" \
            --notes "장 마감 후 자동 축적. 개인 자료는 화이트리스트로 제외." \
            || gh release upload "data-$STAMP" "$Z" --clobber

      # ⚠️ 라운드 81 — 이 요약은 "원장 182,359건"만 찍었다. 두 실행 연속
      #   **같은 숫자**였는데도 초록불이었다. 축소는 가드가 잡지만
      #   **정체는 아무도 안 봤다.** 복원 기준선과의 차이를 찍는다.
      - name: 축적 요약 (복원 기준선 대비 증분)
        if: always()
        run: |
          python scripts/snapshot_guard.py --delta || true
          echo "경로 행수: $(cat .portfolio/bar_paths_s*.jsonl 2>/dev/null | wc -l || echo 0)"

      # 결정 계보 감사 (라운드 71) — 정적이라 네트워크도 데이터도 안 쓴다.
      # **맨 뒤에 둔다**: 축적을 먼저 끝내고, 계보가 어긋나면 그때 붉게
      # 만든다. 축적이 코드 결함에 인질로 잡히지 않게 하려는 순서다.
      # `|| true` 를 붙이지 않는다 — 아무도 안 읽는 경고는 검사가 아니다.
      - name: 결정 계보 감사 (표시 값의 출처 추적 · 원장 정합)
        run: |
          python scripts/lineage_audit.py --ledger
